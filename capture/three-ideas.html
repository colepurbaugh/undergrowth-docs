<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three ideas: pictures</title>
<!-- The pictures and GIFs for three-ideas.md. Each figure is drawn for a moment in time
     by seek(t), in seconds, so three-ideas.mjs can record every frame exactly.
     Open it with ?theme=dark for the dark versions. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
:root {
  --plate: #E5EBE2;
  --dot: #C5D0C3;
  --surface: #FBFCF9;
  --hull: #D9E7DA;
  --ink: #16221A;
  --ink-2: #4E5D52;
  --line: #C9D4C8;
  --moss: #2E7346;
  --moss-ink: #215838;
  --gold: #B07400;
  --gold-ink: #774E00;
  --gold-tint: #F6E6BB;
  --red: #B8382B;
  --red-ink: #9A2C20;
  --font-body: "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, Consolas, monospace;
}
:root[data-theme="dark"] {
  --plate: #151F19;
  --dot: #27352C;
  --surface: #1A251F;
  --hull: #1C3024;
  --ink: #E2EBE1;
  --ink-2: #9EADA1;
  --line: #2A3A30;
  --moss: #72BC87;
  --moss-ink: #92D3A5;
  --gold: #E5AA36;
  --gold-ink: #F2C468;
  --gold-tint: #3A2D0F;
  --red: #EF6B5A;
  --red-ink: #F59A8D;
}
html, body { margin: 0; background: transparent; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.plate {
  position: absolute; left: 0; top: 0;
  box-sizing: border-box;
  display: none;
  padding: 12px;
  border-radius: 20px;
  background-color: var(--plate);
  background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.5px);
  background-size: 16px 16px;
  background-position: 8px 8px;
}
.plate.on { display: block; }
.plate svg { display: block; width: 100%; height: auto; overflow: visible; }

.fig text { font-family: var(--font-body); font-size: 13px; fill: var(--ink-2); }
.fig .lbl, .fig .mid { text-anchor: middle; }
.fig .hull-label, .fig .tab-text { font-weight: 700; fill: var(--moss-ink); }
.fig .tab-text.red { fill: var(--red-ink); }
.fig .m-name { font-weight: 700; font-size: 13.5px; fill: var(--ink); }
.fig .m-right { font-size: 13px; fill: var(--ink-2); }
.fig .m-right.red { font-weight: 700; fill: var(--red-ink); }
.fig .m-right.deny { font-weight: 700; fill: var(--ink); }
.fig .mission-text { font-weight: 700; fill: var(--gold-ink); text-anchor: middle; }
.fig .pill-text { font-weight: 700; font-size: 12.5px; fill: var(--ink); text-anchor: middle; }
.fig .q { font-weight: 700; font-size: 18px; fill: var(--ink-2); text-anchor: middle; }
.fig .chip-text { font-weight: 700; font-size: 12px; fill: var(--ink); text-anchor: middle; }
.fig #m-chip.below .chip-text { fill: var(--gold-ink); }
.fig .lbl.on { font-weight: 700; fill: var(--gold-ink); }
.chip { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
#m-chip.below .chip { fill: var(--gold-tint); stroke: var(--gold); }
.ring { fill: var(--surface); stroke: var(--moss); stroke-width: 2.5; }
.ring.on { stroke: var(--gold); }
.ring.packed { fill: var(--hull); }
.ring.stranger { stroke: var(--ink-2); stroke-width: 2; stroke-dasharray: 4 4; }
.ripple { fill: none; stroke: var(--moss); stroke-width: 2; }
.ripple.red { stroke: var(--red); }
.glow, .halo { fill: var(--gold); }
.wave { fill: none; stroke: var(--gold); stroke-width: 1.8; stroke-linecap: round; }
.link { stroke: var(--moss); stroke-width: 2.5; }
.hull { fill: var(--hull); stroke: var(--moss); stroke-width: 1.5; }
.hull.locked { stroke-width: 2.6; }
.hull.soft { fill: var(--moss); fill-opacity: 0.09; }
.hull.rescue { fill: var(--red); fill-opacity: 0.1; stroke: var(--red); }
.tab { fill: var(--surface); stroke: var(--moss); stroke-width: 1.5; }
.tab.rescue { stroke: var(--red); }
.mini line { stroke: var(--moss); stroke-width: 1.6; }
.mini circle { fill: var(--moss); }
.ico {
  color: var(--ink);
  fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}
.ico-moss { color: var(--moss-ink); stroke-width: 2; }
.ico-red { color: var(--red-ink); stroke-width: 2; }
.mission-line { fill: none; stroke: var(--gold); stroke-width: 2.5; stroke-dasharray: 7 6; }
.mission-head { fill: var(--gold); }
.pill { fill: var(--gold-tint); stroke: var(--gold); stroke-width: 1.5; }
.hit { stroke: var(--ink-2); stroke-width: 4; stroke-linecap: round; }
.burst path { fill: none; stroke: var(--ink-2); stroke-width: 2.2; stroke-linecap: round; }
.rescue-link { stroke: var(--red); stroke-width: 2; stroke-dasharray: 4 4; }
.pin { fill: var(--red); stroke: var(--surface); stroke-width: 2; }
.card { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.fig .log-head { font-family: var(--font-mono); font-weight: 600; font-size: 11px; letter-spacing: 0.14em; fill: var(--ink-2); }
.live { fill: var(--moss); }
.fig .l-time { font-family: var(--font-mono); font-size: 12px; fill: var(--ink-2); }
.fig .l-time.fresh { font-weight: 600; fill: var(--moss-ink); }
.fig .l-title { font-weight: 700; font-size: 13px; fill: var(--ink); }
.fig .l-mission { font-weight: 700; font-size: 12.5px; fill: var(--gold-ink); }
.fig .l-detail { font-size: 12.5px; fill: var(--ink-2); }
.l-sep { stroke: var(--line); stroke-width: 1; }
.l-fresh { fill: var(--moss); }
.num { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.fig .num-t { font-family: var(--font-mono); font-weight: 600; font-size: 11px; fill: var(--ink-2); text-anchor: middle; }
</style>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">

  <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="16.5" height="9" rx="2"/><path d="M21.5 10.6v2.8M6.5 10.8v2.4M10 10.8v2.4M13.5 10.8v2.4"/></symbol>

  <symbol id="i-boat" viewBox="0 0 24 24"><path d="M3 15.5h18l-2.6 4.2H5.6z"/><path d="M12 3.2v12.3"/><path d="M12 4.6l6.2 8.6H12"/></symbol>
  <symbol id="i-office" viewBox="0 0 24 24"><path d="M3.5 20.5h17"/><path d="M6 20.5V4.5h8.5v16"/><path d="M14.5 9.5H18v11"/><path d="M8.6 8h3.3M8.6 11.5h3.3M8.6 15h3.3"/></symbol>
</svg>

<!-- Log entries arriving one by one, newest on top, fresh ones lit -->
<div class="plate" id="fig-log" style="width:344px">
  <svg class="fig" viewBox="0 0 320 220">
    <defs><clipPath id="l-clip"><rect x="0" y="40" width="320" height="176"/></clipPath></defs>
    <rect class="card" x="0.75" y="0.75" width="318.5" height="218.5" rx="14"/>
    <text class="log-head" x="16" y="25">FROM THE LOG</text>
    <circle class="live" id="l-live" cx="302" cy="21" r="4"/>
    <g id="l-list" clip-path="url(#l-clip)"></g>
  </svg>
</div>

<script>
document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'light'

const $ = id => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const prog = (t, a, b) => clamp((t - a) / (b - a))          // 0 before a, 1 after b
const lerp = (a, b, p) => a + (b - a) * p
const ease = p => p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2
const easeIn = p => p * p * p
const easeOut = p => 1 - (1 - p) ** 3
const easeBack = p => { const c = 1.70158; return 1 + (c + 1) * (p - 1) ** 3 + c * (p - 1) ** 2 }
const op = (el, o) => el.setAttribute('opacity', clamp(o).toFixed(3))
const at = (el, x, y, s = 1) => el.setAttribute('transform',
  `translate(${x.toFixed(2)} ${y.toFixed(2)})` + (s === 1 ? '' : ` scale(${Math.max(0.001, s).toFixed(3)})`))
const grow = (el, p) => { el.style.strokeDasharray = '1'; el.style.strokeDashoffset = (1 - clamp(p)).toFixed(3) }  // draws a pathLength="1" line

function drawNode(t) {
  for (let i = 0; i < 4; i++) {
    const s = 0.3 + i * 0.9, p = prog(t, s, s + 1), live = t >= s && t < s + 1
    $(`n${i}r`).setAttribute('r', (26 + 18 * easeOut(p)).toFixed(2))
    op($(`n${i}r`), live ? 0.6 * (1 - p) : 0)
    $(`n${i}c`).style.strokeWidth = live ? (2.5 + 1.3 * Math.sin(Math.PI * clamp(p / 0.4))).toFixed(2) : ''
  }
  const s = 0.3 + 2 * 0.9   // the light glows while it is checked
  op($('n2g'), t >= s && t < s + 1.3 ? 0.45 * Math.sin(Math.PI * prog(t, s, s + 1.3)) : 0)
}

function drawCluster(t) {
  const apart = [[52, 58], [160, 84], [268, 56]], together = [[66, 72], [160, 72], [254, 72]]
  const p = ease(prog(t, 1, 2)) * (1 - ease(prog(t, 5, 5.9)))
  for (let i = 0; i < 3; i++) at($(`c${i}`), lerp(apart[i][0], together[i][0], p), lerp(apart[i][1], together[i][1], p))
  const kept = 1 - prog(t, 4.7, 5.1)
  const link = t < 1.9 ? 0 : ease(prog(t, 1.9, 2.4))
  for (const id of ['c-l1', 'c-l2']) { grow($(id), link); op($(id), kept) }
  op($('c-hull'), ease(prog(t, 2.1, 2.6)) * kept)
}

function drawMission(t) {
  const readings = [[0, 64], [0.9, 63], [1.8, 62], [2.7, 61], [4.7, 62], [5.6, 63], [6.5, 64]]
  let v = 64, since = 0
  for (const [s, value] of readings) if (t >= s) { v = value; since = s }
  $('m-chip-t').textContent = `${v} °F`
  $('m-chip').classList.toggle('below', v < 62)
  const pop = since > 0 ? 1 + 0.12 * (1 - prog(t, since, since + 0.25)) : 1
  $('m-chip').setAttribute('transform', pop === 1 ? '' : `translate(56 54) scale(${pop.toFixed(3)}) translate(-56 -54)`)
  const act = ease(prog(t, 2.8, 3)) * (1 - ease(prog(t, 4.75, 4.95)))
  op($('m-arrow'), 0.28 + 0.72 * act)
  $('m-line').style.strokeDashoffset = (-19.5 * clamp(t - 2.8, 0, 2)).toFixed(2)   // 3 dash lengths, so the loop joins up
  const on = ease(prog(t, 3, 3.25)) * (1 - ease(prog(t, 4.75, 5)))
  op($('m-halo'), on * 0.3)
  $('m-heater').classList.toggle('on', on > 0.5)
  $('m-hlabel').textContent = on > 0.5 ? 'heater on' : 'heater'
  $('m-hlabel').classList.toggle('on', on > 0.5)
  for (let k = 0; k < 3; k++) {
    const ph = (((t - 3) / 0.9 + k / 3) % 1 + 1) % 1
    op($(`m-w${k}`), on * Math.sin(Math.PI * ph))
    $(`m-w${k}`).setAttribute('transform', `translate(0 ${(-6 * ph).toFixed(2)})`)
  }
}

function drawGrow(t) {
  const P1 = 70, P2 = 160, P3 = 250, Y = 88
  const again = t >= 9   // back to the lone phone before the loop starts over
  const s = again ? 1 : lerp(1, 0.17, ease(prog(t, 5.2, 6.2)))
  $('g-charging').setAttribute('transform', s === 1 ? '' : `translate(${P3} ${Y}) scale(${s.toFixed(3)}) translate(${-P3} ${-Y})`)
  op($('g-charging'), again ? 1 : 1 - prog(t, 5.8, 6.2))
  at($('g-phone'), lerp(P2, P1, again ? 0 : ease(prog(t, 1.6, 2.4))), Y)
  op($('g-phone'), again ? ease(prog(t, 9.45, 9.85)) : 1)   // only once the desk has gone
  const cable = again ? 0 : prog(t, 2, 2.5), battery = again ? 0 : prog(t, 2.2, 2.7)
  at($('g-cable'), P2, Y, easeBack(cable)); op($('g-cable'), cable)
  at($('g-battery'), P3, Y, easeBack(battery)); op($('g-battery'), battery)
  const links = again ? 0 : ease(prog(t, 2.6, 3))
  grow($('g-cl1'), links); grow($('g-cl2'), links)
  const hull = again ? 0 : ease(prog(t, 2.8, 3.3))
  op($('g-chull'), hull); op($('g-clabel'), hull)

  op($('g-desk'), 1 - prog(t, 9, 9.4))
  const desk = ease(prog(t, 5.8, 6.3))
  op($('g-dhull'), desk); op($('g-dlabel'), desk)
  const packed = prog(t, 5.9, 6.3), laptop = prog(t, 6.1, 6.5), lamp = prog(t, 6.3, 6.7)
  at($('g-packed'), P3, Y, lerp(0.6, 1, easeOut(packed))); op($('g-packed'), packed)
  at($('g-laptop'), P1, Y, easeBack(laptop)); op($('g-laptop'), laptop)
  at($('g-lamp'), P2, Y, easeBack(lamp)); op($('g-lamp'), lamp)
  const deskLinks = ease(prog(t, 6.6, 7))
  grow($('g-dl1'), deskLinks); grow($('g-dl2'), deskLinks)

  op($('g-cap1'), again ? prog(t, 9.4, 9.55) : 1 - prog(t, 1.8, 1.95))
  op($('g-cap2'), prog(t, 1.95, 2.1) * (1 - prog(t, 5.3, 5.45)))
  op($('g-cap3'), prog(t, 5.45, 5.6) * (1 - prog(t, 9.2, 9.35)))
}

function drawHome(t) {
  const hitAt = 1.35
  let x = 300
  if (t >= 0.8 && t < hitAt) x = lerp(300, 262, easeIn(prog(t, 0.8, hitAt)))
  else if (t >= hitAt && t < 2) x = lerp(262, 306, easeOut(prog(t, hitAt, 2)))
  else if (t >= 2 && t < 2.35) x = lerp(306, 300, ease(prog(t, 2, 2.35)))
  at($('h-stranger'), x, 106)
  const flash = t >= hitAt && t < hitAt + 0.45 ? 1 - prog(t, hitAt, hitAt + 0.45) : 0
  op($('h-hit'), 0.9 * flash)
  op($('h-burst'), flash)
  const shake = t >= hitAt && t < hitAt + 0.5 ? 12 * Math.sin((t - hitAt) * 2 * Math.PI * 6) * (1 - prog(t, hitAt, hitAt + 0.5)) : 0
  $('h-lock').setAttribute('transform', `rotate(${shake.toFixed(2)} 18.5 14)`)
  $('h-deny').classList.toggle('deny', t >= hitAt && t < 2.4)
}

function drawRescue(t) {
  const kept = 1 - prog(t, 7, 7.6)   // the rescue is over: its cluster goes away
  const hull = $('r-hull')
  const drawn = ease(prog(t, 0.8, 2))
  hull.style.strokeDasharray = drawn < 1 ? '100' : 'none'   // no hairline gap where the outline starts
  hull.style.strokeDashoffset = (100 * (1 - drawn)).toFixed(2)
  hull.style.strokeOpacity = (t >= 0.8 ? kept : 0).toFixed(3)
  hull.style.fillOpacity = (0.1 * ease(prog(t, 1.6, 2.2)) * kept).toFixed(3)
  const label = ease(prog(t, 1.8, 2.3)) * kept
  op($('r-tab'), label); op($('r-only'), label)
  op($('r-link'), 0.7 * ease(prog(t, 2.3, 2.6)) * kept)
  const A = 141, B = 219
  const trips = [[2.8, 3.6, A, B], [4.2, 5, B, A], [5.6, 6.4, A, B]]
  let pin = null
  for (const [s, e, from, to] of trips) if (t >= s && t < e) pin = { x: lerp(from, to, ease(prog(t, s, e))), o: Math.min(prog(t, s, s + 0.1), 1 - prog(t, e - 0.1, e)) }
  $('r-pin').setAttribute('cx', (pin ? pin.x : A).toFixed(2))
  op($('r-pin'), pin ? pin.o : 0)
  const ripple = (id, times) => {
    const s = times.find(s => t >= s && t < s + 0.5)
    const p = s === undefined ? 1 : prog(t, s, s + 0.5)
    $(id).setAttribute('r', (17 + 12 * easeOut(p)).toFixed(2))
    op($(id), s === undefined ? 0 : 0.8 * (1 - p))
  }
  ripple('r-ripB', [3.6, 6.4])
  ripple('r-ripA', [5])
}

const LOG = [
  ['7:02 PM', 'Heater on', 'Keep the bedroom warm', 'Bedroom 61 °F, below 62 °F.'],
  ['7:38 PM', 'Heater off', '', 'Bedroom back to 62 °F.'],
  ['9:15 PM', 'Set by hand', '', 'Bedroom set to 55 °F, as a test.'],
  ['9:15 PM', 'Heater on', 'Keep the bedroom warm', '55 °F, set by hand.'],
  ['9:20 PM', 'Back to real readings', '', 'The test is over.'],
  ['10:05 PM', 'Alert', '', 'The window sensor went quiet.'],
  ['10:07 PM', 'Alert seen', '', 'Someone looked at it.'],
]
const ARRIVE = LOG.map((_, k) => 0.4 + 1.5 * k)
const LOG_LENGTH = 10.9
const NS = 'http://www.w3.org/2000/svg'
const make = (tag, attrs, text) => {
  const el = document.createElementNS(NS, tag)
  for (const k in attrs) el.setAttribute(k, attrs[k])
  if (text != null) el.textContent = text
  return el
}
const rows = LOG.map(([time, what, mission, why]) => {
  const g = make('g', {}), fresh = make('rect', { class: 'l-fresh', x: 8, y: 3, width: 304, height: 50, rx: 8 })
  const clock = make('text', { class: 'l-time', x: 16, y: 22 }, time)
  const title = make('text', { class: 'l-title', x: 84, y: 22 }, what)
  if (mission) title.append(make('tspan', { class: 'l-mission', dx: 8 }, mission))
  g.append(fresh, clock, title, make('text', { class: 'l-detail', x: 84, y: 41 }, why),
    make('line', { class: 'l-sep', x1: 16, y1: 55.5, x2: 304, y2: 55.5 }))
  $('l-list').append(g)
  return { g, fresh, clock }
})

function drawLog(t) {
  const push = ARRIVE.map(s => ease(prog(t, s, s + 0.3)))           // the older entries move down a row,
  const shown = ARRIVE.map(s => ease(prog(t, s + 0.25, s + 0.55)))  // then the new one appears at the top
  const fade = 1 - prog(t, LOG_LENGTH - 0.7, LOG_LENGTH - 0.3)
  rows.forEach((row, k) => {
    if (t < ARRIVE[k] + 0.25) { op(row.g, 0); return }
    let slot = 0
    for (let j = k + 1; j < rows.length; j++) slot += push[j]
    row.g.setAttribute('transform', `translate(0 ${(44 + 56 * slot - 8 * (1 - shown[k])).toFixed(2)})`)
    op(row.g, shown[k] * (1 - clamp((slot - 2) * 2)) * fade)
    op(row.fresh, 0.16 * (1 - prog(t, ARRIVE[k] + 2, ARRIVE[k] + 2.35)))   // a short fade keeps the GIF small
    row.clock.classList.toggle('fresh', t < ARRIVE[k] + 2.15)
  })
  const last = ARRIVE.filter(s => t >= s + 0.3).pop()
  op($('l-live'), last === undefined ? 0.35 : 0.35 + 0.65 * (1 - prog(t, last + 0.3, last + 1.2)))
}

// duration: seconds in one loop. still: the moment used for the still picture.
// fps: frames a second, if not the usual 20 (the log's sliding text makes big frames).
const FIGURES = {
  node: { duration: 4.4, still: 0, draw: drawNode },
  cluster: { duration: 6, still: 3.5, draw: drawCluster },
  mission: { duration: 7.4, still: 3.8, draw: drawMission },
  grow: { duration: 10, still: 8, draw: drawGrow },
  'lock-home': { duration: 3.6, still: 0, draw: drawHome },
  'lock-rescue': { duration: 8.4, still: 6, draw: drawRescue },
  log: { duration: LOG_LENGTH, still: 4.4, fps: 15, draw: drawLog },
}
let active = 'node'
window.figures = () => Object.entries(FIGURES).map(([name, f]) => ({ name, duration: f.duration, still: f.still, fps: f.fps }))
window.show = name => {
  document.querySelectorAll('.plate').forEach(plate => plate.classList.toggle('on', plate.id === `fig-${name}`))
  active = name
  FIGURES[name].draw(0)
  const box = $(`fig-${name}`).getBoundingClientRect()
  return { x: box.x, y: box.y, width: box.width, height: box.height }
}
window.seek = t => FIGURES[active].draw(t)
window.fontsReady = async () => {
  await Promise.all(['400 13px', '700 13px'].map(f => document.fonts.load(`${f} "Atkinson Hyperlegible Next"`))
    .concat(['400 12px', '600 12px'].map(f => document.fonts.load(`${f} "Atkinson Hyperlegible Mono"`))))
  return document.fonts.check('700 13px "Atkinson Hyperlegible Next"') && document.fonts.check('400 12px "Atkinson Hyperlegible Mono"')
}
// Opened by hand, it plays the figure named after # (for example three-ideas.html#grow).
if (location.hash) {
  const name = location.hash.slice(1), start = performance.now()
  show(name)
  const tick = now => { seek(((now - start) / 1000) % FIGURES[name].duration); requestAnimationFrame(tick) }
  requestAnimationFrame(tick)
}
</script>
</body>
</html>
