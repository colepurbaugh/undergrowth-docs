<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300" role="img" aria-label="Old Shucks, the Undergrowth fisherman">
  <title>Old Shucks</title>
  <!-- An original cartoon mascot: a wide-eyed old salt in a yellow slicker and black sou'wester. -->
  <defs>
    <linearGradient id="slicker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c736"/><stop offset="1" stop-color="#e2a91c"/>
    </linearGradient>
    <linearGradient id="hook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ced3"/><stop offset="1" stop-color="#7d858c"/>
    </linearGradient>
  </defs>

  <!-- Slicker -->
  <path d="M38 300 C40 236 70 208 130 204 C190 208 222 236 224 300 Z" fill="url(#slicker)" stroke="#2a2416" stroke-width="4" stroke-linejoin="round"/>
  <path d="M130 206 L130 300" stroke="#c48d10" stroke-width="3"/>
  <circle cx="139" cy="242" r="5" fill="#2a2416"/>
  <circle cx="139" cy="276" r="5" fill="#2a2416"/>
  <!-- Collar with dark trim -->
  <path d="M84 214 L130 240 L108 262 Z" fill="#f6c736" stroke="#2a2416" stroke-width="4" stroke-linejoin="round"/>
  <path d="M176 214 L130 240 L152 262 Z" fill="#f6c736" stroke="#2a2416" stroke-width="4" stroke-linejoin="round"/>
  <path d="M90 217 L128 239" stroke="#2a2416" stroke-width="6" stroke-linecap="round"/>
  <path d="M170 217 L132 239" stroke="#2a2416" stroke-width="6" stroke-linecap="round"/>

  <!-- Hook hand, raised -->
  <path d="M60 300 C58 272 62 252 74 236" fill="none" stroke="#2a2416" stroke-width="30" stroke-linecap="round"/>
  <path d="M60 300 C58 272 62 252 74 236" fill="none" stroke="#e8b52a" stroke-width="22" stroke-linecap="round"/>
  <rect x="62" y="222" width="24" height="14" rx="3" fill="#5b6268" stroke="#2a2416" stroke-width="3" transform="rotate(-20 74 229)"/>
  <path d="M78 222 C88 196 82 166 58 160 C38 155 26 172 32 188" fill="none" stroke="#2a2416" stroke-width="12" stroke-linecap="round"/>
  <path d="M78 222 C88 196 82 166 58 160 C38 155 26 172 32 188" fill="none" stroke="url(#hook)" stroke-width="7" stroke-linecap="round"/>
  <path d="M32 188 L24 182 L36 180 Z" fill="#7d858c" stroke="#2a2416" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Neck and face -->
  <path d="M110 190 L150 190 L148 214 L112 214 Z" fill="#e7b48f"/>
  <ellipse cx="130" cy="142" rx="50" ry="60" fill="#f0c3a0" stroke="#2a2416" stroke-width="4"/>
  <ellipse cx="80" cy="146" rx="9" ry="14" fill="#e7b48f" stroke="#2a2416" stroke-width="3"/>
  <ellipse cx="180" cy="146" rx="9" ry="14" fill="#e7b48f" stroke="#2a2416" stroke-width="3"/>
  <!-- Wind-burnt cheeks -->
  <ellipse cx="100" cy="158" rx="11" ry="7" fill="#e58f7c" opacity=".55"/>
  <ellipse cx="160" cy="158" rx="11" ry="7" fill="#e58f7c" opacity=".55"/>

  <!-- Grey stubble and goatee -->
  <path d="M86 160 C88 196 108 210 130 210 C152 210 172 196 174 160 C166 176 156 186 130 186 C104 186 94 176 86 160 Z" fill="#9b9b97" opacity=".85"/>
  <path d="M112 186 C114 204 122 214 130 214 C138 214 146 204 148 186 Z" fill="#7f7f7a"/>

  <!-- Wide, staring eyes -->
  <ellipse cx="111" cy="134" rx="14" ry="15" fill="#fff" stroke="#2a2416" stroke-width="3"/>
  <ellipse cx="149" cy="134" rx="14" ry="15" fill="#fff" stroke="#2a2416" stroke-width="3"/>
  <circle cx="113" cy="135" r="5" fill="#1c1a17"/>
  <circle cx="147" cy="135" r="5" fill="#1c1a17"/>
  <circle cx="115" cy="133" r="1.6" fill="#fff"/>
  <circle cx="149" cy="133" r="1.6" fill="#fff"/>
  <!-- Eyebrows, raised high -->
  <path d="M94 112 C102 104 114 104 124 110" fill="none" stroke="#4a3b2d" stroke-width="5" stroke-linecap="round"/>
  <path d="M136 110 C146 104 158 104 166 112" fill="none" stroke="#4a3b2d" stroke-width="5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M130 140 C126 152 124 158 130 162 C135 164 139 160 137 157" fill="none" stroke="#2a2416" stroke-width="3" stroke-linecap="round"/>
  <!-- Mouth, open mid-proclamation -->
  <path d="M110 172 C116 166 144 166 150 172 C148 186 140 194 130 194 C120 194 112 186 110 172 Z" fill="#5a1f1c" stroke="#2a2416" stroke-width="3" stroke-linejoin="round"/>
  <path d="M114 172 C120 169 140 169 146 172 L144 178 C136 176 124 176 116 178 Z" fill="#fff"/>

  <!-- Sou'wester: a soft crown, and a wide brim that droops down over the ears -->
  <g transform="translate(0 -12)">
    <path d="M86 108 C82 66 104 46 130 46 C156 46 178 66 174 108 Z" fill="#26231f" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 72 C110 60 122 56 136 58" fill="none" stroke="#4a4640" stroke-width="5" stroke-linecap="round"/>
    <path d="M38 150 C40 118 84 96 130 96 C176 96 220 118 222 150 C212 150 198 132 178 118 C156 110 104 110 82 118 C62 132 48 150 38 150 Z"
          fill="#2e2a25" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <path d="M52 136 C74 112 186 112 208 136" fill="none" stroke="#4a4640" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- A few strands of hair escaping the hat -->
  <path d="M90 112 C88 124 92 130 96 134" fill="none" stroke="#4a3b2d" stroke-width="3" stroke-linecap="round"/>
  <path d="M170 112 C172 122 168 128 165 132" fill="none" stroke="#4a3b2d" stroke-width="3" stroke-linecap="round"/>
</svg>
